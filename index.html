<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Developer's Area 51 — Elite Dev Marketplace</title>
<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #040810;
  --bg2: #060c14;
  --bg3: #0a1220;
  --bgcard: #0c1825;
  --bgcard2: #0f1e2e;
  --cyan: #00d4ff;
  --green: #00ff88;
  --purple: #8b5cf6;
  --orange: #ff7340;
  --red: #ff3366;
  --gold: #ffd700;
  --text: #ddeeff;
  --text2: #6a95b5;
  --muted: #2d4a62;
  --border: #0e2035;
  --border2: #163050;
  --border3: #1e4070;
  --glow-c: 0 0 30px rgba(0,212,255,.25);
  --glow-g: 0 0 30px rgba(0,255,136,.25);
  --glow-p: 0 0 30px rgba(139,92,246,.3);
  --glow-o: 0 0 30px rgba(255,115,64,.3);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Exo 2',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--cyan);border-radius:3px}
/* scanlines */
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,212,255,.012) 3px,rgba(0,212,255,.012) 4px);pointer-events:none;z-index:9998}
/* grid */
.grid-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.025) 1px,transparent 1px);background-size:60px 60px;z-index:0;pointer-events:none}

/* SCROLL BAR */
.scroll-bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--border);z-index:9999}
.scroll-fill{height:100%;background:linear-gradient(90deg,#00d4ff,#8b5cf6,#00ff88);width:0%;transition:width .1s}

/* ANNOUNCE */
.announce{background:linear-gradient(90deg,rgba(0,212,255,.1),rgba(139,92,246,.12),rgba(0,212,255,.1));border-bottom:1px solid rgba(0,212,255,.2);padding:9px 1rem;text-align:center;font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--text2);letter-spacing:.5px;position:relative;z-index:100}
.announce b{color:var(--cyan)}

/* NAV */
nav{position:fixed;top:40px;width:100%;background:rgba(4,8,16,.88);backdrop-filter:blur(24px);border-bottom:1px solid var(--border2);z-index:500;padding:0 2rem}
.nav-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;cursor:pointer}
.logo-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--cyan),var(--purple));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;animation:logoPulse 3s ease-in-out infinite;flex-shrink:0}
@keyframes logoPulse{0%,100%{box-shadow:0 0 15px rgba(0,212,255,.4)}50%{box-shadow:0 0 40px rgba(0,212,255,.7),0 0 80px rgba(139,92,246,.3)}}
.logo-text{font-family:'Orbitron',monospace;font-size:.95rem;font-weight:700;color:var(--cyan);line-height:1}
.logo-sub{font-family:'JetBrains Mono',monospace;font-size:.52rem;color:var(--muted);letter-spacing:3px;margin-top:2px}
.nav-links{display:flex;align-items:center;gap:2rem;list-style:none}
.nav-links a{color:var(--text2);text-decoration:none;font-size:.82rem;font-weight:500;letter-spacing:.5px;transition:color .2s;text-transform:uppercase;cursor:pointer}
.nav-links a:hover{color:var(--cyan)}
.nav-right{display:flex;align-items:center;gap:.75rem}

/* BUTTONS */
.btn{padding:9px 20px;border-radius:8px;font-family:'Exo 2',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:.5px;border:none;display:inline-flex;align-items:center;gap:6px}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text2)}
.btn-ghost:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:var(--glow-c)}
.btn-cyan{background:linear-gradient(135deg,#00d4ff,#0099cc);color:#000;font-weight:700}
.btn-cyan:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(0,212,255,.5)}
.btn-green{background:linear-gradient(135deg,#00ff88,#00c96a);color:#000;font-weight:700}
.btn-green:hover{transform:translateY(-2px);box-shadow:var(--glow-g)}
.btn-purple{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff}
.btn-purple:hover{transform:translateY(-2px);box-shadow:var(--glow-p)}
.btn-orange{background:linear-gradient(135deg,#ff7340,#cc4c1f);color:#fff}
.btn-orange:hover{transform:translateY(-2px);box-shadow:var(--glow-o)}
.btn-danger{background:linear-gradient(135deg,#ff3366,#cc0033);color:#fff}

.cart-btn{position:relative;background:var(--bgcard);border:1px solid var(--border2);color:var(--text);padding:9px 16px;border-radius:8px;cursor:pointer;font-family:'Exo 2',sans-serif;font-size:.82rem;display:flex;align-items:center;gap:8px;transition:all .2s;font-weight:600}
.cart-btn:hover{border-color:var(--cyan);box-shadow:var(--glow-c)}
.cart-count{background:var(--cyan);color:#000;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;min-width:20px}

/* HERO */
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;padding:140px 2rem 80px;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none}
.orb1{width:700px;height:700px;background:radial-gradient(circle,rgba(0,212,255,.1),transparent 70%);top:-200px;left:-300px;animation:of 9s ease-in-out infinite}
.orb2{width:600px;height:600px;background:radial-gradient(circle,rgba(139,92,246,.13),transparent 70%);bottom:-200px;right:-200px;animation:of 11s ease-in-out infinite reverse}
.orb3{width:400px;height:400px;background:radial-gradient(circle,rgba(0,255,136,.08),transparent 70%);top:50%;right:20%;animation:of 13s ease-in-out infinite}
@keyframes of{0%,100%{transform:translate(0,0)}33%{transform:translate(40px,-30px)}66%{transform:translate(-30px,40px)}}
.hero-inner{max-width:1000px;text-align:center;position:relative;z-index:2}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.25);color:var(--cyan);padding:7px 18px;border-radius:50px;font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:2px;margin-bottom:2rem;animation:fiu .6s ease both}
.bdot{width:7px;height:7px;background:var(--green);border-radius:50%;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes fiu{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fid{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.hero-title{font-family:'Orbitron',monospace;font-size:clamp(2.8rem,6.5vw,6rem);font-weight:900;line-height:.95;margin-bottom:1.5rem;animation:fid .8s ease .2s both}
.ht1{color:var(--text);display:block}
.ht2{background:linear-gradient(135deg,#00d4ff 0%,#8b5cf6 50%,#00ff88 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:block}
.hero-desc{font-size:1.1rem;color:var(--text2);max-width:620px;margin:0 auto 2.5rem;line-height:1.75;animation:fid .8s ease .4s both}... (112 KB left)
